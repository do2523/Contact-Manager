<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Karla:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="directory-header">
    <div class="directory-header__inner">
      <div class="brand">
        <span class="brand__mark">Contacts</span>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-shell">
      <div id="banner" class="banner" role="status" hidden></div>

      <div class="ad-card auth-card">
        <div class="ad-card__header">
          <span>Directory Access</span>
        </div>
        <div class="ad-card__body">
        <div class="auth-tabs" role="tablist" aria-label="Choose sign in or register">
          <button
            type="button"
            class="auth-tab is-active"
            id="loginTabBtn"
            role="tab"
            aria-selected="true"
            aria-controls="loginForm"
          >
            Log In
          </button>
          <button
            type="button"
            class="auth-tab"
            id="registerTabBtn"
            role="tab"
            aria-selected="false"
            aria-controls="registerForm"
          >
            Register
          </button>
        </div>

        <form id="loginForm" novalidate>
          <div class="field" id="field-loginUsername">
            <label for="loginUsername">Username</label>
            <input
              type="text"
              id="loginUsername"
              name="username"
              required
              maxlength="50"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
            />
            <span class="field__error"></span>
          </div>

          <div class="field" id="field-loginPassword">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" required autocomplete="current-password" />
            <span class="field__error"></span>
          </div>

          <button type="submit" class="btn btn--primary auth-submit" id="loginSubmitBtn">Log In</button>
        </form>

        <form id="registerForm" novalidate hidden>
          <div class="field" id="field-registerUsername">
            <label for="registerUsername">Username</label>
            <input
              type="text"
              id="registerUsername"
              name="username"
              required
              maxlength="50"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
            />
            <span class="field__error"></span>
          </div>

          <div class="field" id="field-registerPassword">
            <label for="registerPassword">Password</label>
            <input
              type="password"
              id="registerPassword"
              name="password"
              required
              autocomplete="new-password"
              aria-describedby="passwordRules"
            />
            <span class="field__error"></span>
            <ul class="password-rules" id="passwordRules" aria-label="Password requirements">
              <li data-rule="length">At least 8 characters</li>
              <li data-rule="upper">One uppercase letter</li>
              <li data-rule="lower">One lowercase letter</li>
              <li data-rule="number">One number</li>
              <li data-rule="special">One special character (for example ! @ # $ %)</li>
            </ul>
          </div>

          <div class="field" id="field-registerConfirm">
            <label for="registerConfirm">Retype Password</label>
            <input
              type="password"
              id="registerConfirm"
              name="confirmPassword"
              required
              autocomplete="new-password"
            />
            <span class="field__error"></span>
          </div>

          <button type="submit" class="btn btn--primary auth-submit" id="registerSubmitBtn">Create Account</button>
        </form>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
