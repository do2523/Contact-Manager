<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Lemon Pages — Sign In</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="directory-header">
    <div class="directory-header__inner">
      <div class="brand">
        <span class="brand__mark">The Lemon <em>Pages</em></span>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-shell">
      <div id="banner" class="banner" role="status" hidden></div>

      <div class="ad-card auth-card">
        <div class="ad-card__header">
          <span>Directory Access</span>
        </div>
        <div class="ad-card__body">
        <div class="auth-tabs" role="tablist" aria-label="Choose sign in or register">
          <button
            type="button"
            class="auth-tab is-active"
            id="loginTabBtn"
            role="tab"
            aria-selected="true"
            aria-controls="loginForm"
          >
            Log In
          </button>
          <button
            type="button"
            class="auth-tab"
            id="registerTabBtn"
            role="tab"
            aria-selected="false"
            aria-controls="registerForm"
          >
            Register
          </button>
        </div>

        <form id="loginForm" novalidate>
          <div class="field" id="field-loginEmail">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" name="email" required autocomplete="email" />
            <span class="field__error"></span>
          </div>

          <div class="field" id="field-loginPassword">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" required autocomplete="current-password" />
            <span class="field__error"></span>
          </div>

          <button type="submit" class="btn btn--primary auth-submit" id="loginSubmitBtn">Log In</button>
        </form>

        <form id="registerForm" novalidate hidden>
          <div class="field" id="field-registerFirstName">
            <label for="registerFirstName">First Name</label>
            <input type="text" id="registerFirstName" name="firstName" required autocomplete="given-name" />
            <span class="field__error"></span>
          </div>

          <div class="field" id="field-registerLastName">
            <label for="registerLastName">Last Name</label>
            <input type="text" id="registerLastName" name="lastName" required autocomplete="family-name" />
            <span class="field__error"></span>
          </div>

          <div class="field" id="field-registerEmail">
            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" name="email" required autocomplete="email" />
            <span class="field__error"></span>
          </div>

          <div class="field" id="field-registerPassword">
            <label for="registerPassword">Password</label>
            <input
              type="password"
              id="registerPassword"
              name="password"
              required
              autocomplete="new-password"
              minlength="8"
            />
            <span class="field__error"></span>
          </div>

          <div class="field" id="field-registerConfirm">
            <label for="registerConfirm">Confirm Password</label>
            <input
              type="password"
              id="registerConfirm"
              name="confirmPassword"
              required
              autocomplete="new-password"
            />
            <span class="field__error"></span>
          </div>

          <button type="submit" class="btn btn--primary auth-submit" id="registerSubmitBtn">Create Account</button>
        </form>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
