openapi: 3.0.0

info:
  title: Contact Manager API
  version: 1.0.0

paths:
  /api/auth/register.php:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - password_confirmation
              properties:
                username:
                  type: string
                  example: "KevinG"
                password:
                  type: string
                  format: password
                  example: "pass123"
                password_confirmation:
                  type: string
                  format: password
                  example: "pass123"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error: 
                    type: string 
        "400":
          description: Registration error
        "405":
          description: Method not allowed
        "409":
          description: Username taken
        "500":
          description: SQL error

  /api/auth/login.php:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "KevinG"
                password:
                  type: string
                  example: "pass123"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  error: 
                    type: string
        "400":
          description: Username and password are required
        "401":
          description: Invalid username or password
        "405":
          description: Method not allowed

  /api/auth/logout.php:
    post:
      summary: Logout user
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string

  /api/auth/session.php:
    get:
      summary: Check current user session
      responses:
        "200":
          description: User is logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  error:
                    type: string

        "401":
          description: User is not logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
